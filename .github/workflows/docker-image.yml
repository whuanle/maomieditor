name: Build & Push Docker Image

on:
  push:
    tags: ["v*"]
  # 允许在 Actions 页面手动触发（首次配置好密钥后用它验证）
  workflow_dispatch:

env:
  # Docker Hub 镜像名（whuanle 账号下）；如需改名只改这里
  IMAGE_NAME: whuanle/maomiedtor

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Docker Hub 密钥配在名为 docker 的 Environment secrets 里
    environment: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 标签规则：
      #   push v1.2.3 → 1.2.3 + 1.2 + latest
      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            # 手动触发（workflow_dispatch）时没有 tag，用 dev 兜底
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}

      # 目前只出 amd64；需要 arm64（NAS/树莓派）时改成 linux/amd64,linux/arm64
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
